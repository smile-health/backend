name: Build and Push Docker Images & Package

on:
  push:
    branches: [main, master, dev, demo]
  pull_request:
    branches: [main, master, dev, demo]

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.ref_name }}-${{ github.sha }}

jobs:
  build-and-push-lib:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      lib-version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'

      - name: Configure .npmrc for GitHub Packages
        run: |
          echo "@smile-health:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get lib version
        id: get-version
        run: |
          cd packages/lib
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      # Install lib on its own: run inside the monorepo, npm resolves the whole
      # workspace and crashed ("Cannot read properties of null (reading
      # 'edgesOut')"). lib ships TypeScript source and has no build script,
      # so this step only verifies its dependencies resolve.
      - name: Install dependencies (isolated)
        run: |
          rm -rf /tmp/lib && cp -r packages/lib /tmp/lib && cp .npmrc /tmp/lib/.npmrc
          cd /tmp/lib && npm install --ignore-scripts --no-audit --no-fund

      - name: Publish to GitHub Package Registry
        continue-on-error: true
        run: |
          cd packages/lib
          npm publish --registry https://npm.pkg.github.com --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Make lib package public
        continue-on-error: true
        run: |
          curl -s -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/smile-health/packages/npm/%40smile-health%2Flib" \
            -d '{"visibility":"public"}'

  build-and-push-images:
    needs: build-and-push-lib
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [auth-service, core, main, sync-service, warehouse-service, notification]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=${{ matrix.service }}-latest,enable={{is_default_branch}}

      - name: Create .npmrc for GitHub Packages
        run: |
          echo "@smile-health:registry=https://npm.pkg.github.com" > ./apps/${{ matrix.service }}/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ./apps/${{ matrix.service }}/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Make package public
        continue-on-error: true
        run: |
          PKG_NAME="backend%2F${{ matrix.service }}"
          curl -s -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/smile-health/packages/container/${PKG_NAME}" \
            -d '{"visibility":"public"}'
