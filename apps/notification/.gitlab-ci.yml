build:
  image: docker:stable
  stage: build
  except:
    - /^feature.*$/
    - /^fix.*$/
  services:
    - docker:stable-dind
  variables:
    IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" "$CI_REGISTRY" --password-stdin
    - docker build -t $IMAGE_TAG .
    - docker push $IMAGE_TAG

push_to_smile:
  image: docker:stable
  stage: deploy
  only:
    refs:
      - /^hotfix.*$/
      - master
      - ci
      - tags
  services:
    - docker:stable-dind
  variables:
    IMAGE_BUILD_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
    IMAGE_TAG: $CI_PROJECT_NAME:$CI_COMMIT_REF_SLUG
    IMAGE_SMILE_TAG: $GIT_SMILE_REGISTRY/$CI_PROJECT_NAMESPACE/$IMAGE_TAG
  script:
    - echo "$GIT_SMILE_PASSWORD" | docker login --username $GIT_SMILE_USERNAME --password-stdin $GIT_SMILE_REGISTRY
    - docker tag $IMAGE_BUILD_TAG $IMAGE_SMILE_TAG
    - docker push $IMAGE_SMILE_TAG

deploy_staging:
  only:
    refs:
      - master
      - ci
      - tags
  stage: deploy
  image: registry.gitlab.com/gitlab-org/cloud-deploy/aws-base:latest
  variables:
    IMAGE_BUILD_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
    IMAGE_TAG: $CI_PROJECT_NAME:$CI_COMMIT_REF_SLUG
  script:
   - echo $IMAGE_BUILD_TAG . $IMAGE_TAG
   - aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin 786718767555.dkr.ecr.ap-southeast-3.amazonaws.com
   - aws eks update-kubeconfig --region $REGION --name $CLUSTER
   - docker tag $IMAGE_BUILD_TAG 786718767555.dkr.ecr.ap-southeast-3.amazonaws.com/$IMAGE_TAG
   - docker push 786718767555.dkr.ecr.ap-southeast-3.amazonaws.com/$IMAGE_TAG
   - kubectl -n $NAMESPACE rollout restart deployment/$CI_PROJECT_NAME