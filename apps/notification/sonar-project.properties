# required metadata
sonar.projectKey=smile-notification
sonar.projectName=smile-notification
sonar.projectVersion=1.0.0

# optional description
sonar.projectDescription=SMILE Notification

# path to source directories (required)
sonar.sources=./src

#sonar.exclusions=node_modules/**,tests/**,app/db/migrations/**,app/db/seeders/**,coverage/**

# The value of the property must be the key of the language.
sonar.language=js

#sonar.profile=node
#sonar.tests=spec/node

sonar.dynamicAnalysis=reuseReports


# Encoding of the source code
sonar.sourceEncoding=UTF-8

sonar.javascript.lcov.reportPaths=coverage/lcov.info
