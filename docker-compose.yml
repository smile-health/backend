include:
  - path:
      - infra/compose-database.yml
      - infra/compose-message.yml
      - infra/compose-storage.yml
      - infra/compose-keycloak.yml

services:
  proxy:
    container_name: proxy
    image: nginx:alpine
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./infra/proxy.conf:/etc/nginx/conf.d/default.conf
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - apparmor:unconfined
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  service-core:
    container_name: service-core
    build: ./apps/core
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./apps/core/.env
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - apparmor:unconfined
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  service-immunization:
    container_name: service-immunization
    build: ./apps/platform
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - ./apps/platform/.env
    environment:
      FALLBACK_SERVER_URL: http://dev.badr.co.id:8005
      WORKSPACE_ID: 1
      DB_NAME: smile_imun
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
