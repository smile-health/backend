services:
  postgres:
    image: postgres:${POSTGRES_VERSION}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "keycloak"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - type: tmpfs
        target: /var/lib/postgresql/data
        tmpfs:
          size: 100000000
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - apparmor:unconfined

  keycloak:
    container_name: keycloak
    build:
      context: .
      dockerfile: ./keycloak/Dockerfile
      args:
        - KC_VERSION=${KC_VERSION}
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_USERNAME: ${KC_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_DB_URL: "jdbc:postgresql://postgres:5432/keycloak"
      KC_METRICS_ENABLED: true
      KC_LOG_LEVEL: ${KC_LOG_LEVEL}
      KC_REALM_NAME: ${KC_REALM_NAME}
      KC_REALM_DISPLAY_NAME: ${KC_REALM_DISPLAY_NAME}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      SMILE_HOME_URL: ${SMILE_HOSTNAME}:${SMILE_SERVER_HTTP_PORT}
      KC_REALM_FE_URL: ${KC_HOSTNAME}:${KC_PORT}/auth
      REALM_SYSUSER_EMAIL: ${REALM_SYSUSER_EMAIL}
      REALM_SYSUSER_PASSWORD: ${REALM_SYSUSER_PASSWORD}
      P_ADMIN_USERNAME: ${P_ADMIN_USERNAME}
      P_ADMIN_PASSWORD: ${P_ADMIN_PASSWORD}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD}
      CUST_USERNAME: ${CUST_USERNAME}
      CUST_PASSWORD: ${CUST_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER_NAME: ${SMTP_USER_NAME}
      SMTP_USER_PASSWORD: ${SMTP_USER_PASSWORD}
    ports:
      - "127.0.0.1:${KC_PORT}:8080"
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - apparmor:unconfined
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
