# Required metadata
sonar.projectKey=smile-lib
sonar.projectName=Smile Library
sonar.projectVersion=1.0.122
sonar.sources=.
sonar.tests=__tests__
sonar.test.inclusions=**/*.test.ts
sonar.exclusions=**/*.test.ts,**/node_modules/**,**/dist/**,**/coverage/**

# Language
sonar.language=ts
sonar.sourceEncoding=UTF-8
sonar.ts.tsconfigPath=tsconfig.json

# Coverage reporting
sonar.javascript.lcov.reportPaths=coverage/lcov-report/lcov.info
sonar.coverage.exclusions=**/*.test.ts,**/node_modules/**,**/dist/**,**/coverage/**
sonar.javascript.coverage.reportPaths=coverage/lcov-report/lcov.info
sonar.typescript.coverage.reportPaths=coverage/lcov-report/lcov.info

# Test reporting
sonar.testExecutionReportPaths=coverage/test-report.xml

# Additional settings
sonar.typescript.tsconfigPath=tsconfig.json
sonar.typescript.lcov.reportPaths=coverage/lcov-report/lcov.info

# Authentication
sonar.login=${SONAR_TOKEN}
sonar.host.url=${SONAR_HOST_URL}

# Coverage settings
sonar.coverage.jacoco.xmlReportPaths=coverage/lcov-report/lcov.info
sonar.javascript.coverage.lcov.reportPaths=coverage/lcov-report/lcov.info 